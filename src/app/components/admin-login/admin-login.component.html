<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="logo-section">
        <span class="material-icons logo-icon">event</span>
        <h1>E-Events</h1>
      </div>
      <h2>Connexion</h2>
      <p>Connectez-vous pour accéder au tableau de bord</p>
    </div>

    <div *ngIf="errorMessage" class="alert alert-error">
      <span class="material-icons">error</span>
      {{ errorMessage }}
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="username">
          <span class="material-icons">account_circle</span>
          Nom d'utilisateur
        </label>
        <input
          type="text"
          id="username"
          formControlName="username"
          class="form-control"
          placeholder="Entrez votre nom d'utilisateur"
          [class.error]="submitted && f['username'].errors"
          autofocus
        />
        <div *ngIf="submitted && f['username'].errors" class="error-message">
          Le nom d'utilisateur est requis
        </div>
      </div>

      <div class="form-group">
        <label for="password">
          <span class="material-icons">lock</span>
          Mot de passe
        </label>
        <div class="password-input-wrapper">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            formControlName="password"
            class="form-control"
            placeholder="Entrez votre mot de passe"
            [class.error]="submitted && f['password'].errors"
          />
          <button
            type="button"
            class="toggle-password"
            (click)="togglePasswordVisibility()"
          >
            <span class="material-icons">{{ showPassword ? 'visibility_off' : 'visibility' }}</span>
          </button>
        </div>
        <div *ngIf="submitted && f['password'].errors" class="error-message">
          Le mot de passe est requis
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="loading">
        <span *ngIf="!loading" class="material-icons">login</span>
        <span *ngIf="loading" class="spinner-small"></span>
        <span>{{ loading ? 'Connexion en cours...' : 'Se connecter' }}</span>
      </button>

      <div class="login-footer">
        <p>Vous n'avez pas de compte ?</p>
        <button type="button" class="btn-link" (click)="goToRegister()">
          Créer un compte
        </button>
      </div>
    </form>
  </div>
</div>
